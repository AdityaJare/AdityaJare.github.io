  <!-- Typography -->
  <text x="250" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#50e6ff" text-anchor="middle" letter-spacing="2">MICROSOFT AZURE</text>
  <text x="250" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">Cloud Services &amp; Infrastructure</text>
  <text x="250" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Virtual Machines • Web Deployment • Cloud Architecture</text>
  
  <rect x="180" y="262" width="140" height="24" rx="12" fill="#0078d4" fill-opacity="0.25" stroke="#50e6ff" stroke-width="1"/>
  <text x="250" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#50e6ff" text-anchor="middle">VERIFIED BADGE</text>
