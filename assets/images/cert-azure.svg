  </defs>
  <rect width="500" height="320" rx="16" fill="url(#azBg)" stroke="#0078d4" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="18" y="18" width="464" height="284" rx="12" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.8"/>

  <!-- Azure Cloud Icon in Seal -->
  <circle cx="250" cy="105" r="46" fill="#031d33" stroke="url(#azureBlue)" stroke-width="3"/>
  <circle cx="250" cy="105" r="36" fill="none" stroke="#50e6ff" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Cloud symbol -->
  <path d="M 236 112 A 10 10 0 0 1 246 98 A 14 14 0 0 1 262 101 A 9 9 0 0 1 267 112 Z" fill="#0078d4" stroke="#50e6ff" stroke-width="1.5"/>

