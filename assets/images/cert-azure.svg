      <stop offset="0%" stop-color="#031d33" />
      <stop offset="50%" stop-color="#0b2942" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="azureBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4" />
      <stop offset="100%" stop-color="#50e6ff" />
