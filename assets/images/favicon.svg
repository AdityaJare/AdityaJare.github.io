<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Neural CV Aperture Grid -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="6" fill="#38bdf8" fill-opacity="0.8"/>
  <!-- Monogram AJ -->
  <text x="32" y="39" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">AJ</text>
  <!-- Vision corner ticks -->
  <path d="M 16 22 L 16 16 L 22 16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 48 22 L 48 16 L 42 16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 16 42 L 16 48 L 22 48" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 48 42 L 48 48 L 42 48" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
</svg>
