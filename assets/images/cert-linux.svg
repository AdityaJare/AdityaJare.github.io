<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="linuxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091811" />
      <stop offset="50%" stop-color="#0f291e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="linuxGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#linuxBg)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="18" y="18" width="464" height="284" rx="12" fill="none" stroke="#1e3a2b" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.8"/>

  <!-- Linux Terminal Seal -->
  <circle cx="250" cy="105" r="46" fill="#091811" stroke="url(#linuxGreen)" stroke-width="3"/>
  <circle cx="250" cy="105" r="36" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Terminal Prompt symbol >_ -->
  <path d="M 240 98 L 247 105 L 240 112" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="252" y1="112" x2="260" y2="112" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Badge Ribbon -->
  <path d="M 238 145 L 232 175 L 250 166 L 268 175 L 262 145" fill="url(#gold)"/>

  <!-- Typography -->
  <text x="250" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="2">LINUX FOUNDATION / LFCA</text>
  <text x="250" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">Learning Linux for LFCA Certification</text>
  <text x="250" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">System Administration • Security • Cloud &amp; DevOps</text>
  
  <rect x="180" y="262" width="140" height="24" rx="12" fill="#059669" fill-opacity="0.25" stroke="#34d399" stroke-width="1"/>
  <text x="250" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">VERIFIED COURSERA</text>
</svg>
