<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="dlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#dlBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="18" y="18" width="464" height="284" rx="12" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  
  <!-- Neural Net Nodes Graphic -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <line x1="80" y1="80" x2="160" y2="50"/>
    <line x1="80" y1="80" x2="160" y2="110"/>
    <line x1="80" y1="140" x2="160" y2="110"/>
    <line x1="80" y1="140" x2="160" y2="170"/>
    <line x1="420" y1="80" x2="340" y2="50"/>
    <line x1="420" y1="80" x2="340" y2="110"/>
    <line x1="420" y1="140" x2="340" y2="110"/>
    <line x1="420" y1="140" x2="340" y2="170"/>
  </g>

  <!-- DeepLearning.AI Seal -->
  <circle cx="250" cy="105" r="46" fill="#0f172a" stroke="url(#blueGlow)" stroke-width="3"/>
  <circle cx="250" cy="105" r="36" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Neural Icon in Center -->
  <circle cx="238" cy="95" r="5" fill="#38bdf8"/>
  <circle cx="238" cy="115" r="5" fill="#38bdf8"/>
  <circle cx="262" cy="105" r="6" fill="#818cf8"/>
  <line x1="238" y1="95" x2="262" y2="105" stroke="#38bdf8" stroke-width="2"/>
  <line x1="238" y1="115" x2="262" y2="105" stroke="#38bdf8" stroke-width="2"/>

  <!-- Badge Ribbon -->
  <path d="M 238 145 L 232 175 L 250 166 L 268 175 L 262 145" fill="url(#gold)"/>

  <!-- Typography -->
  <text x="250" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">DEEPLEARNING.AI</text>
  <text x="250" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">Deep Learning Specialization</text>
  <text x="250" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Instructor: Andrew Ng • Coursera Verified</text>
  
  <rect x="180" y="262" width="140" height="24" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
  <text x="250" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">OFFICIAL CREDENTIAL</text>
